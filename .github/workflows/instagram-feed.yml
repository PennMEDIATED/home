# Keeps the homepage Instagram grid current: every 30 minutes (and on demand)
# fetch the newest @penn_mediated posts and commit them if they changed.
# Setup: repo Settings > Secrets and variables > Actions > INSTAGRAM_ACCESS_TOKEN
# (see README "Instagram grid").
name: Update Instagram feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: node scripts/fetch-instagram.mjs
      - name: Commit if changed
        run: |
          git add data/instagram.json assets/instagram
          if git diff --cached --quiet; then echo "No new posts."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Instagram feed"
          git push
